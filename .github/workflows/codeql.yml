name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run Docker Container
        run: docker run -d --name web -p 8080:8080 go-web-server

      - name: Wait for server to start
        run: |
          for i in $(seq 1 15); do
            curl -s -o /dev/null "http://localhost:8080/readfile?file=hello.txt" && exit 0
            sleep 1
          done
          echo "Server did not start in time"
          docker logs web
          exit 1

      - name: Test /readfile endpoint
        run: curl -f "http://localhost:8080/readfile?file=safe-files/hello.txt"

      - name: Stop Container
        if: always()
        run: docker rm -f web
